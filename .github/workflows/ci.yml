# Three independent jobs, no shared state between them — each brings up
# whatever it needs (Postgres/Redis are cheap to start fresh per job) rather
# than trying to share a migrated DB across jobs, which would mean
# sequencing and slowing everything down for no real benefit at this scale.
#
# Runs with zero GitHub Secrets: nothing here calls a real external API.
# Stripe calls in apps/web's tests are pure/mocked (billing-checkout.test.ts
# asserts on request *shapes*, never hits stripe.com); token-sealing
# keypairs are generated fresh per run. Env vars below are non-secret
# placeholders, not real credentials — safe to commit in the open.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches docker-compose.yml exactly, so the same DATABASE_URL works
  # whether you're running this locally or in CI.
  DATABASE_URL: postgres://botmarket:botmarket@localhost:5432/botmarket
  REDIS_URL: redis://localhost:6379

jobs:
  web:
    name: Web (lint, test, build)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: botmarket
          POSTGRES_PASSWORD: botmarket
          POSTGRES_DB: botmarket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U botmarket"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from package.json's "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - name: Apply Postgres schema (Drizzle migrations)
        run: pnpm --filter web exec drizzle-kit migrate

      - run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Non-secret placeholders — see file header. Build never queries a
          # live DB (every DB-touching route is server-rendered on demand,
          # not statically prerendered), but Postgres/Redis are already up
          # for the migration/test steps, so there's no reason to guess.
          AUTH_SECRET: ci-placeholder-not-a-real-secret
          STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_real

  runtime:
    name: Runtime (pytest against real Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: botmarket
          POSTGRES_PASSWORD: botmarket
          POSTGRES_DB: botmarket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U botmarket"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # Node/pnpm here only to run Drizzle migrations, which own the schema
      # the Python tests' conftest.py fixtures write into directly.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply Postgres schema (Drizzle migrations)
        run: pnpm --filter web exec drizzle-kit migrate

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python deps
        working-directory: workers/runtime
        run: uv sync --locked

      - name: Run tests
        working-directory: workers/runtime
        run: uv run pytest -q

  cross-plane:
    name: Cross-plane token seal contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install Python deps
        working-directory: workers/runtime
        run: uv sync --locked

      # Seals a token in TS with an ephemeral keypair's public half, unseals
      # it in Python with the private half — proves the two-plane token
      # design (specs/05-security.md) hasn't drifted apart. No DB/Redis
      # needed, no real secret — the keypair is generated fresh every run.
      - run: ./scripts/check-token-seal.sh

  ci-success:
    name: CI
    if: always()
    needs: [web, runtime, cross-plane]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          if [ "$FAILED" = "true" ]; then
            echo "One or more required jobs failed."
            exit 1
          fi
