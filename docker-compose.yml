# Local dev only — production uses managed Postgres + Redis (specs/02-architecture.md).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: botmarket
      POSTGRES_PASSWORD: botmarket
      POSTGRES_DB: botmarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
