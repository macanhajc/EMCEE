# Local dev only — production uses managed Postgres (specs/02-architecture.md).
# No Redis: config pub/sub runs over Postgres LISTEN/NOTIFY on this same
# database since 2026-07-22 (docs/cost-plan.md, R6) — one fewer service to
# run, here and in production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: botmarket
      POSTGRES_PASSWORD: botmarket
      POSTGRES_DB: botmarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
