# Single-box prod deploy (R1, docs/cost-plan.md): web + supervisor +
# Postgres + Caddy on one VPS, no Redis (config pub/sub runs over Postgres
# LISTEN/NOTIFY since R6). Build and run from the repo root:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Copy .env.prod.example -> .env.prod first and fill in real values — never
# commit .env.prod itself (see .gitignore). Always run with an explicit
# project name — this directory also has a dev docker-compose.yml, and
# without -p they'd default to the same project name and fight over the
# same pgdata volume:
#   docker compose -p botmarket-prod -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Migrations: the `migrate` one-off service below — run manually after
# `up`, and again after any deploy that changes apps/web/drizzle. `migrate`
# is profile-gated ("tools"), so plain `up --build` above never rebuilds
# it — ALWAYS pass --build here too, or `run` silently reuses whatever
# `migrate` image was built on a previous deploy (drizzle-kit then sees
# last deploy's migrations folder, not this one, and reports success
# having applied nothing new):
#   docker compose -p botmarket-prod -f docker-compose.prod.yml --env-file .env.prod --profile tools run --build --rm migrate
#
# Catalog seed: same `migrate` image, command overridden — run once after
# the first migrate, and again any time STRIPE_EMCEE_*_PRICE_ID changes
# (apps/web/src/db/seed.ts is an upsert, safe to re-run). Same --build
# caveat as above:
#   docker compose -p botmarket-prod -f docker-compose.prod.yml --env-file .env.prod --profile tools run --build --rm migrate pnpm --filter web exec tsx src/db/seed.ts
#
# Backups + cron routes: deploy/backup.sh and deploy/crontab — host
# crontab entries, not services here (they need to run on a schedule
# independent of whether this stack is mid-restart).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: migrate/backup both reach this over the internal
    # compose network (docker compose exec/run), never the host network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* get inlined into the client bundle at build time, so
      # they're passed here too, not just as runtime environment below.
      args:
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
        SENTRY_ORG: ${SENTRY_ORG}
        SENTRY_PROJECT: ${SENTRY_PROJECT}
        SENTRY_AUTH_TOKEN: ${SENTRY_AUTH_TOKEN}
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
      # Required behind any reverse proxy (Caddy here) — see Auth.js's
      # UntrustedHost error otherwise. AUTH_URL pins the canonical origin
      # explicitly rather than relying solely on header-based inference —
      # trustHost alone left Auth.js's built-in error-page redirect falling
      # back to the container's own bind address (0.0.0.0:3000) instead of
      # the real domain.
      AUTH_TRUST_HOST: "true"
      AUTH_URL: https://${DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      TOKEN_SEAL_PUBLIC_KEY: ${TOKEN_SEAL_PUBLIC_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_EMCEE_MONTHLY_PRICE_ID: ${STRIPE_EMCEE_MONTHLY_PRICE_ID}
      STRIPE_EMCEE_ANNUAL_PRICE_ID: ${STRIPE_EMCEE_ANNUAL_PRICE_ID}
      STRIPE_EMCEE_LIFETIME_PRICE_ID: ${STRIPE_EMCEE_LIFETIME_PRICE_ID}
      CRON_SECRET: ${CRON_SECRET}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL}
      APP_ORIGIN: https://${DOMAIN}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY}
      NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # One-off: docker compose --profile tools run --rm migrate (see header
  # comment). Targets apps/web/Dockerfile's builder stage — same image
  # web's own build already produces on the way to the standalone runner,
  # just stopped one stage earlier where devDependencies (drizzle-kit) and
  # the full source tree are still present. Also doubles as the runner for
  # the catalog seed (overrides the default command — see header comment):
  #   ... run --rm migrate pnpm --filter web exec tsx src/db/seed.ts
  # so it carries the Stripe price IDs the seed script reads too, not just
  # DATABASE_URL.
  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: builder
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      STRIPE_EMCEE_MONTHLY_PRICE_ID: ${STRIPE_EMCEE_MONTHLY_PRICE_ID}
      STRIPE_EMCEE_ANNUAL_PRICE_ID: ${STRIPE_EMCEE_ANNUAL_PRICE_ID}
      STRIPE_EMCEE_LIFETIME_PRICE_ID: ${STRIPE_EMCEE_LIFETIME_PRICE_ID}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pnpm", "--filter", "web", "exec", "drizzle-kit", "migrate"]

  runtime:
    build:
      context: .
      dockerfile: workers/runtime/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TOKEN_SEAL_PRIVATE_KEY: ${TOKEN_SEAL_PRIVATE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
