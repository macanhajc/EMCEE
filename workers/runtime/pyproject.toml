[project]
name = "botmarket-runtime"
version = "0.1.0"
description = "BotMarket data plane: bot supervisor + catalog bots (specs/04-bot-runtime.md)"
# SDK transitively pins pendulum==2.1.2, which needs distutils (gone in 3.12+).
requires-python = ">=3.11,<3.12"
dependencies = [
    # Official Pocket Worlds SDK — pinned; bumps go canary-first (specs/04-bot-runtime.md).
    "highrise-bot-sdk==25.1.0",
    # Runtime revalidates config against packages/schemas before applying.
    # <4.18: newer needs typing-extensions>=4.4, but the SDK pins 3.10.
    "jsonschema>=4.17,<4.18",
    # Token unseal (libsodium sealed boxes) — the only decrypt path in the system.
    "pynacl>=1.5",
    # Lease claiming, status/events, and config pub/sub (via LISTEN/NOTIFY)
    # all against the one shared Postgres — no Redis in this plane at all
    # (heartbeats removed 2026-07-22 R2; pub/sub moved off Redis 2026-07-22
    # R6 — docs/cost-plan.md).
    "asyncpg>=0.30",
    # highrise.__main__ imports pkg_resources at module load (to read its
    # own version) but doesn't declare setuptools as a runtime dependency —
    # a real gap in the SDK's own packaging. Pinned <81: setuptools split
    # pkg_resources out of the default install above that version.
    "setuptools<81",
    # Loads workers/runtime/.env for the bare `uv run python supervisor.py`
    # dev path (README). Prod's docker-compose.prod.yml injects real secrets
    # via `environment:` instead — no .env file ships in the image, so this
    # is a no-op there.
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "aiohttp>=3.12"]

[tool.setuptools]
py-modules = ["supervisor", "tokenbox", "keygen", "db"]
packages = ["catalog"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
